name: Novelo CI & Release Quality

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
      - 'chore/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    # Pinned to ubuntu-24.04 for deterministic and reproducible builds during the GitHub Actions Ubuntu 26.04 rollout
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publish Test Results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  lint:
    name: Android Lint Check
    # Pinned to ubuntu-24.04 for deterministic and reproducible builds during the GitHub Actions Ubuntu 26.04 rollout
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  release-build-and-audit:
    name: Release Build & Security Audit
    # Pinned to ubuntu-24.04 for deterministic and reproducible builds during the GitHub Actions Ubuntu 26.04 rollout
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Zero Network Permissions (Security Invariant)
        run: |
          echo "Auditing merged release manifest for forbidden network permissions..."
          MANIFEST_FILE=$(find app/build/intermediates/merged_manifest -name "AndroidManifest.xml" | head -n 1)
          if [ -z "$MANIFEST_FILE" ]; then
            MANIFEST_FILE=$(find app/build/intermediates/merged_manifests -name "AndroidManifest.xml" | head -n 1)
          fi
          echo "Found merged manifest: $MANIFEST_FILE"
          
          if grep -i -E "android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE" "$MANIFEST_FILE"; then
            echo "::error::Violation of Novelo Offline-First invariant! Network permission found in merged manifest."
            exit 1
          else
            echo "Zero network permissions verified: INTERNET and ACCESS_NETWORK_STATE are absent."
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: novelo-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
